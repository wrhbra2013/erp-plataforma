<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ERP Fiscal</title>
  <link rel="stylesheet" href="../static/css/default.css">
  <link rel="icon" type="image/x-icon" href="../static/css/favicon/favicon.ico">
  <style>
    .login-error {
      color: var(--brand-danger);
      font-size: 0.85rem;
      text-align: center;
      margin-bottom: 16px;
      display: none;
    }
    .password-toggle {
      position: relative;
    }
    .password-toggle .toggle-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div style="text-align:center;margin-bottom:16px;">
        <div style="width:64px;height:64px;background:var(--brand-primary);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:2rem;color:white;">
          <i class="bi bi-calculator"></i>
        </div>
        <h1>ERP Fiscal</h1>
        <p>Plataforma de Gestão Empresarial</p>
      </div>

      <div id="loginError" class="login-error"></div>

      <form id="loginForm" onsubmit="return handleLogin(event)">
        <div class="form-group">
          <label for="username">Usuário</label>
          <input type="text" id="username" class="form-control" placeholder="Nome de usuário ou email" required>
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <div class="password-toggle">
            <input type="password" id="password" class="form-control" placeholder="Sua senha" required>
            <button type="button" class="toggle-btn" onclick="togglePassword()" aria-label="Mostrar senha">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" id="loginBtn" class="btn btn-primary btn-block btn-lg" style="margin-top:8px;">
          <span id="loginBtnText">Entrar</span>
          <span id="loginSpinner" class="spinner" style="display:none;width:20px;height:20px;border-width:2px;"></span>
        </button>
      </form>
    </div>
  </div>

  <script src="../static/js/api.js"></script>
  <script>
    // Auto-redirect if already logged in
    if (API.isAuthenticated()) {
      window.location.href = '../index.html';
    }

    function handleLogin(e) {
      e.preventDefault();
      var user = document.getElementById('username').value.trim();
      var pass = document.getElementById('password').value;
      var btn = document.getElementById('loginBtn');
      var btnText = document.getElementById('loginBtnText');
      var spinner = document.getElementById('loginSpinner');
      var errorEl = document.getElementById('loginError');

      btn.disabled = true;
      btnText.textContent = 'Entrando...';
      spinner.style.display = 'inline-block';
      errorEl.style.display = 'none';

      API.login(user, pass)
        .then(function(d) {
          window.location.href = '../index.html';
        })
        .catch(function(err) {
          errorEl.textContent = err.message || 'Erro ao fazer login. Verifique suas credenciais.';
          errorEl.style.display = 'block';
          btn.disabled = false;
          btnText.textContent = 'Entrar';
          spinner.style.display = 'none';
        });

      return false;
    }

    function togglePassword() {
      var p = document.getElementById('password');
      var icon = event.target.closest('button').querySelector('i');
      if (p.type === 'password') {
        p.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        p.type = 'password';
        icon.className = 'bi bi-eye';
      }
    }
  </script>
</body>
</html>
