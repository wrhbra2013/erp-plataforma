<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendas - ERP Fiscal</title>
  <link rel="stylesheet" href="../static/css/default.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="icon" type="image/svg+xml" href="../static/css/favicon/favicon.svg">
  <link rel="icon" type="image/x-icon" href="../static/css/favicon/favicon.ico">
  <script src="../static/js/api.js"></script>
  <script src="../static/js/main.js"></script>
</head>
<body>
  <script>var ROOT='..';</script>
  <script src="../components/header.js"></script>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:8px;">
    <div>
      <h2 style="font-size:1.3rem;color:var(--heading-color);margin:0;">Vendas</h2>
      <p style="font-size:0.85rem;color:var(--text-muted);margin:4px 0 0;">Registro de vendas realizadas</p>
    </div>
    <button class="btn btn-primary" onclick="abrirModalVenda()"><i class="bi bi-plus-lg"></i> Nova Venda</button>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Cliente</th>
          <th>Descrição</th>
          <th>Valor Total</th>
          <th>CBS</th>
          <th>IBS</th>
          <th>Data</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="vendasTable">
        <tr><td colspan="9" class="text-center text-muted" style="padding:40px;"><div class="loading"><div class="spinner"></div></div></td></tr>
      </tbody>
    </table>
  </div>

  <div id="vendaModal" class="modal-overlay">
    <div class="modal" style="max-width:700px;">
      <div class="modal-header">
        <h3 id="vendaModalTitle">Nova Venda</h3>
        <button class="modal-close" onclick="fecharModal('vendaModal')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="vendaForm" onsubmit="return salvarVenda(event)">
          <input type="hidden" id="vendaId">
          <div class="form-group">
            <label>Cliente *</label>
            <select id="vCliente" class="form-control" required>
              <option value="">Selecione</option>
            </select>
          </div>
          <div class="form-group">
            <label>Descrição</label>
            <input type="text" id="vDescricao" class="form-control" placeholder="Descrição da venda">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Valor Total *</label>
              <input type="text" id="vValor" class="form-control input-currency" placeholder="R$ 0,00" required>
            </div>
            <div class="form-group">
              <label>Status</label>
              <select id="vStatus" class="form-control">
                <option value="Concluída">Concluída</option>
                <option value="Pendente">Pendente</option>
                <option value="Cancelada">Cancelada</option>
              </select>
            </div>
          </div>
          <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px;">
            <button type="button" class="btn btn-secondary" onclick="fecharModal('vendaModal')">Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar Venda</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
  document.getElementById('pageTitle').textContent = 'Vendas';
  var vendas = [];

  function carregarVendas() {
    API.get('vendas').then(function(data) {
      vendas = Array.isArray(data) ? data : [];
      renderVendas();
    }).catch(function(err) {
      document.getElementById('vendasTable').innerHTML = '<tr><td colspan="9" class="text-center text-muted" style="padding:40px;">Erro: ' + err.message + '</td></tr>';
    });
  }

  function renderVendas() {
    var tbody = document.getElementById('vendasTable');
    if (vendas.length === 0) {
      tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted" style="padding:40px;">Nenhuma venda registrada</td></tr>';
      return;
    }
    tbody.innerHTML = vendas.map(function(v, i) {
      return '<tr>' +
        '<td>' + (i+1) + '</td>' +
        '<td><strong>' + (v.cliente_nome || '-') + '</strong></td>' +
        '<td>' + (v.descricao || '-') + '</td>' +
        '<td>' + formatCurrency(v.valor || 0) + '</td>' +
        '<td>' + formatCurrency(v.cbs_valor || 0) + '</td>' +
        '<td>' + formatCurrency(v.ibs_valor || 0) + '</td>' +
        '<td>' + formatDate(v.created_at) + '</td>' +
        '<td><span class="badge ' + ((v.status||'Concluída')==='Concluída'?'badge-success':(v.status||'')==='Cancelada'?'badge-danger':'badge-warning') + '">' + (v.status||'Concluída') + '</span></td>' +
        '<td>' +
          '<button class="btn btn-sm btn-secondary" onclick="editarVenda(\'' + v.id + '\')" title="Editar"><i class="bi bi-pencil"></i></button> ' +
          '<button class="btn btn-sm btn-danger" onclick="excluirVenda(\'' + v.id + '\')" title="Excluir"><i class="bi bi-trash"></i></button>' +
        '</td>' +
      '</tr>';
    }).join('');
  }

  function abrirModalVenda(data) {
    document.getElementById('vendaForm').reset();
    document.getElementById('vendaId').value = '';
    document.getElementById('vendaModalTitle').textContent = 'Nova Venda';

    API.get('clientes').then(function(d) {
      var clientes = Array.isArray(d) ? d : [];
      var sel = document.getElementById('vCliente');
      sel.innerHTML = '<option value="">Selecione</option>' +
        clientes.map(function(c) {
          return '<option value="' + c.id + '">' + (c.nome || c.razao_social || '') + '</option>';
        }).join('');
      if (data) {
        sel.value = data.cliente_id || '';
      }
    });

    if (data) {
      document.getElementById('vendaModalTitle').textContent = 'Editar Venda';
      document.getElementById('vendaId').value = data.id;
      document.getElementById('vDescricao').value = data.descricao || '';
      document.getElementById('vValor').value = formatCurrency(data.valor || 0);
      document.getElementById('vStatus').value = data.status || 'Concluída';
    }

    document.getElementById('vendaModal').classList.add('active');
  }

  function fecharModal(id) { document.getElementById(id).classList.remove('active'); }

  function salvarVenda(e) {
    e.preventDefault();
    var id = document.getElementById('vendaId').value;
    var sel = document.getElementById('vCliente');
    var clienteId = sel.value;
    var clienteNome = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text : '';
    var data = {
      cliente_id: clienteId,
      cliente_nome: clienteNome,
      descricao: document.getElementById('vDescricao').value,
      valor: parseFloat(document.getElementById('vValor').value.replace(/[^\d,]/g,'').replace(',','.')) || 0,
      status: document.getElementById('vStatus').value,
      cbs_valor: 0,
      ibs_valor: 0
    };

    var promise = id ? API.put('vendas/' + id, data) : API.post('vendas', data);
    promise.then(function() {
      showAlert(id ? 'Venda atualizada!' : 'Venda registrada!', 'success');
      fecharModal('vendaModal');
      carregarVendas();
    }).catch(function(err) {
      showAlert('Erro: ' + err.message, 'danger');
    });
    return false;
  }

  function editarVenda(id) {
    var v = vendas.find(function(x) { return String(x.id) === String(id); });
    if (v) abrirModalVenda(v);
  }

  function excluirVenda(id) {
    if (!confirm('Excluir esta venda?')) return;
    API.del('vendas/' + id).then(function() {
      showAlert('Venda excluída!', 'success');
      carregarVendas();
    }).catch(function(err) {
      showAlert('Erro: ' + err.message, 'danger');
    });
  }

  carregarVendas();
  </script>
  <script src="../components/footer.js"></script>
</body>
</html>
