<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes - ERP Fiscal</title>
  <link rel="stylesheet" href="../static/css/default.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="icon" type="image/x-icon" href="../static/css/favicon/favicon.ico">
  <script src="../static/js/api.js"></script>
  <script src="../static/js/main.js"></script>
</head>
<body>
  <script>var ROOT='..';</script>
  <script src="../components/header.js"></script>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:8px;">
    <div>
      <h2 style="font-size:1.3rem;color:var(--heading-color);margin:0;">Clientes</h2>
      <p style="font-size:0.85rem;color:var(--text-muted);margin:4px 0 0;">Gerencie sua base de clientes</p>
    </div>
    <button class="btn btn-primary" onclick="abrirModalCliente()"><i class="bi bi-plus-lg"></i> Novo Cliente</button>
  </div>

  <div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;">
    <input type="text" id="searchInput" class="form-control" placeholder="Buscar por nome, CNPJ/CPF..." style="max-width:320px;" onkeyup="filtrarClientes()">
    <select id="statusFilter" class="form-control" style="max-width:160px;" onchange="filtrarClientes()">
      <option value="">Todos</option>
      <option value="Ativo">Ativos</option>
      <option value="Inativo">Inativos</option>
    </select>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Nome/Razão Social</th>
          <th>CNPJ/CPF</th>
          <th>Email</th>
          <th>Telefone</th>
          <th>Cidade</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="clientesTable">
        <tr>
          <td colspan="7" class="text-center text-muted" style="padding:40px;">
            <div class="loading"><div class="spinner"></div></div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div id="clienteModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="clienteModalTitle">Novo Cliente</h3>
        <button class="modal-close" onclick="fecharModal('clienteModal')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="clienteForm" onsubmit="return salvarCliente(event)">
          <input type="hidden" id="clienteId">
          <div class="form-row">
            <div class="form-group">
              <label>Nome / Razão Social *</label>
              <input type="text" id="cNome" class="form-control" required>
            </div>
            <div class="form-group">
              <label>Nome Fantasia</label>
              <input type="text" id="cFantasia" class="form-control">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>CNPJ/CPF</label>
              <input type="text" id="cDoc" class="form-control input-cnpj">
            </div>
            <div class="form-group">
              <label>Inscrição Estadual</label>
              <input type="text" id="cIE" class="form-control">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Email</label>
              <input type="email" id="cEmail" class="form-control">
            </div>
            <div class="form-group">
              <label>Telefone</label>
              <input type="text" id="cTel" class="form-control input-phone">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>CEP</label>
              <input type="text" id="cCep" class="form-control input-cep">
            </div>
            <div class="form-group">
              <label>Endereço</label>
              <input type="text" id="cEndereco" class="form-control">
            </div>
          </div>
          <div class="form-row-3">
            <div class="form-group">
              <label>Bairro</label>
              <input type="text" id="cBairro" class="form-control">
            </div>
            <div class="form-group">
              <label>Cidade</label>
              <input type="text" id="cCidade" class="form-control">
            </div>
            <div class="form-group">
              <label>UF</label>
              <select id="cUF" class="form-control">
                <option value="">Selecione</option>
                <option value="AC">AC</option><option value="AL">AL</option><option value="AP">AP</option>
                <option value="AM">AM</option><option value="BA">BA</option><option value="CE">CE</option>
                <option value="DF">DF</option><option value="ES">ES</option><option value="GO">GO</option>
                <option value="MA">MA</option><option value="MT">MT</option><option value="MS">MS</option>
                <option value="MG">MG</option><option value="PA">PA</option><option value="PB">PB</option>
                <option value="PR">PR</option><option value="PE">PE</option><option value="PI">PI</option>
                <option value="RJ">RJ</option><option value="RN">RN</option><option value="RS">RS</option>
                <option value="RO">RO</option><option value="RR">RR</option><option value="SC">SC</option>
                <option value="SP">SP</option><option value="SE">SE</option><option value="TO">TO</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Regime Tributário</label>
              <select id="cRegime" class="form-control">
                <option value="Lucro Presumido">Lucro Presumido</option>
                <option value="Simples Nacional">Simples Nacional</option>
                <option value="Lucro Real">Lucro Real</option>
                <option value="MEI">MEI</option>
              </select>
            </div>
            <div class="form-group">
              <label>Status</label>
              <select id="cStatus" class="form-control">
                <option value="Ativo">Ativo</option>
                <option value="Inativo">Inativo</option>
              </select>
            </div>
          </div>
          <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px;">
            <button type="button" class="btn btn-secondary" onclick="fecharModal('clienteModal')">Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar Cliente</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
  document.getElementById('pageTitle').textContent = 'Clientes';
  var clientes = [];

  function carregarClientes() {
    API.get('clientes').then(function(data) {
      clientes = Array.isArray(data) ? data : [];
      renderClientes();
    }).catch(function(err) {
      document.getElementById('clientesTable').innerHTML = '<tr><td colspan="7" class="text-center text-muted" style="padding:40px;">Erro ao carregar: ' + err.message + '</td></tr>';
    });
  }

  function renderClientes() {
    var search = (document.getElementById('searchInput').value || '').toLowerCase();
    var statusF = document.getElementById('statusFilter').value;
    var filtrados = clientes.filter(function(c) {
      var nome = (c.nome || c.razao_social || '').toLowerCase();
      var doc = (c.cnpj || c.cpf || c.documento || '').toLowerCase();
      var matchSearch = nome.indexOf(search) !== -1 || doc.indexOf(search) !== -1;
      var matchStatus = !statusF || (c.status || 'Ativo') === statusF;
      return matchSearch && matchStatus;
    });
    var tbody = document.getElementById('clientesTable');
    if (filtrados.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted" style="padding:40px;">Nenhum cliente encontrado</td></tr>';
      return;
    }
    tbody.innerHTML = filtrados.map(function(c) {
      return '<tr>' +
        '<td><strong>' + (c.nome || c.razao_social || '-') + '</strong></td>' +
        '<td>' + formatCNPJ(c.cnpj || c.cpf || c.documento || '-') + '</td>' +
        '<td>' + (c.email || '-') + '</td>' +
        '<td>' + (c.telefone || '-') + '</td>' +
        '<td>' + (c.cidade || '-') + '/' + (c.uf || '') + '</td>' +
        '<td><span class="badge ' + ((c.status || 'Ativo') === 'Ativo' ? 'badge-success' : 'badge-danger') + '">' + (c.status || 'Ativo') + '</span></td>' +
        '<td>' +
          '<button class="btn btn-sm btn-secondary" onclick="editarCliente(\'' + c.id + '\')" title="Editar"><i class="bi bi-pencil"></i></button> ' +
          '<button class="btn btn-sm btn-danger" onclick="excluirCliente(\'' + c.id + '\')" title="Excluir"><i class="bi bi-trash"></i></button>' +
        '</td>' +
      '</tr>';
    }).join('');
  }

  function filtrarClientes() { renderClientes(); }

  function abrirModalCliente(data) {
    document.getElementById('clienteForm').reset();
    document.getElementById('clienteId').value = '';
    document.getElementById('clienteModalTitle').textContent = 'Novo Cliente';
    if (data) {
      document.getElementById('clienteModalTitle').textContent = 'Editar Cliente';
      document.getElementById('clienteId').value = data.id;
      document.getElementById('cNome').value = data.nome || data.razao_social || '';
      document.getElementById('cFantasia').value = data.fantasia || '';
      document.getElementById('cDoc').value = data.cnpj || data.cpf || data.documento || '';
      document.getElementById('cIE').value = data.ie || '';
      document.getElementById('cEmail').value = data.email || '';
      document.getElementById('cTel').value = data.telefone || '';
      document.getElementById('cCep').value = data.cep || '';
      document.getElementById('cEndereco').value = data.endereco || '';
      document.getElementById('cBairro').value = data.bairro || '';
      document.getElementById('cCidade').value = data.cidade || '';
      document.getElementById('cUF').value = data.uf || '';
      document.getElementById('cRegime').value = data.regime_tributario || 'Lucro Presumido';
      document.getElementById('cStatus').value = data.status || 'Ativo';
    }
    document.getElementById('clienteModal').classList.add('active');
  }

  function fecharModal(id) { document.getElementById(id).classList.remove('active'); }

  function salvarCliente(e) {
    e.preventDefault();
    var id = document.getElementById('clienteId').value;
    var data = {
      nome: document.getElementById('cNome').value,
      fantasia: document.getElementById('cFantasia').value,
      documento: document.getElementById('cDoc').value.replace(/\D/g, ''),
      ie: document.getElementById('cIE').value,
      email: document.getElementById('cEmail').value,
      telefone: document.getElementById('cTel').value,
      cep: document.getElementById('cCep').value,
      endereco: document.getElementById('cEndereco').value,
      bairro: document.getElementById('cBairro').value,
      cidade: document.getElementById('cCidade').value,
      uf: document.getElementById('cUF').value,
      regime_tributario: document.getElementById('cRegime').value,
      status: document.getElementById('cStatus').value
    };

    var promise = id ? API.put('clientes/' + id, data) : API.post('clientes', data);

    promise.then(function() {
      showAlert(id ? 'Cliente atualizado!' : 'Cliente criado!', 'success');
      fecharModal('clienteModal');
      carregarClientes();
    }).catch(function(err) {
      showAlert('Erro: ' + err.message, 'danger');
    });

    return false;
  }

  function editarCliente(id) {
    var c = clientes.find(function(x) { return String(x.id) === String(id); });
    if (c) abrirModalCliente(c);
  }

  function excluirCliente(id) {
    if (!confirm('Excluir este cliente?')) return;
    API.del('clientes/' + id).then(function() {
      showAlert('Cliente excluído!', 'success');
      carregarClientes();
    }).catch(function(err) {
      showAlert('Erro: ' + err.message, 'danger');
    });
  }

  carregarClientes();
  </script>

  <script src="../components/footer.js"></script>
</body>
</html>
