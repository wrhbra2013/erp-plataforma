<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fornecedores - ERP Fiscal</title>
  <link rel="stylesheet" href="../static/css/default.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="icon" type="image/x-icon" href="../static/css/favicon/favicon.ico">
  <script src="../static/js/api.js"></script>
  <script src="../static/js/main.js"></script>
</head>
<body>
  <script>var ROOT='..';</script>
  <script src="../components/header.js"></script>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:8px;">
    <div>
      <h2 style="font-size:1.3rem;color:var(--heading-color);margin:0;">Fornecedores</h2>
      <p style="font-size:0.85rem;color:var(--text-muted);margin:4px 0 0;">Gerencie seus fornecedores</p>
    </div>
    <button class="btn btn-primary" onclick="abrirModalFornecedor()"><i class="bi bi-plus-lg"></i> Novo Fornecedor</button>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Razão Social</th>
          <th>CNPJ</th>
          <th>Contato</th>
          <th>Email</th>
          <th>Cidade/UF</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="fornecedoresTable">
        <tr><td colspan="7" class="text-center text-muted" style="padding:40px;"><div class="loading"><div class="spinner"></div></div></td></tr>
      </tbody>
    </table>
  </div>

  <div id="fornecedorModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="forModalTitle">Novo Fornecedor</h3>
        <button class="modal-close" onclick="fecharModal('fornecedorModal')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="fornecedorForm" onsubmit="return salvarFornecedor(event)">
          <input type="hidden" id="fId">
          <div class="form-row">
            <div class="form-group"><label>Razão Social *</label><input type="text" id="fNome" class="form-control" required></div>
            <div class="form-group"><label>Nome Fantasia</label><input type="text" id="fFantasia" class="form-control"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>CNPJ</label><input type="text" id="fDoc" class="form-control input-cnpj"></div>
            <div class="form-group"><label>Inscrição Estadual</label><input type="text" id="fIE" class="form-control"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Contato</label><input type="text" id="fContato" class="form-control"></div>
            <div class="form-group"><label>Telefone</label><input type="text" id="fTel" class="form-control input-phone"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Email</label><input type="email" id="fEmail" class="form-control"></div>
            <div class="form-group"><label>CEP</label><input type="text" id="fCep" class="form-control input-cep"></div>
          </div>
          <div class="form-row-3">
            <div class="form-group"><label>Cidade</label><input type="text" id="fCidade" class="form-control"></div>
            <div class="form-group"><label>UF</label>
              <select id="fUF" class="form-control">
                <option value="">Selecione</option>
                <option value="AC">AC</option><option value="AL">AL</option><option value="AP">AP</option><option value="AM">AM</option>
                <option value="BA">BA</option><option value="CE">CE</option><option value="DF">DF</option><option value="ES">ES</option>
                <option value="GO">GO</option><option value="MA">MA</option><option value="MT">MT</option><option value="MS">MS</option>
                <option value="MG">MG</option><option value="PA">PA</option><option value="PB">PB</option><option value="PR">PR</option>
                <option value="PE">PE</option><option value="PI">PI</option><option value="RJ">RJ</option><option value="RN">RN</option>
                <option value="RS">RS</option><option value="RO">RO</option><option value="RR">RR</option><option value="SC">SC</option>
                <option value="SP">SP</option><option value="SE">SE</option><option value="TO">TO</option>
              </select>
            </div>
            <div class="form-group"><label>Status</label>
              <select id="fStatus" class="form-control">
                <option value="Ativo">Ativo</option>
                <option value="Inativo">Inativo</option>
              </select>
            </div>
          </div>
          <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px;">
            <button type="button" class="btn btn-secondary" onclick="fecharModal('fornecedorModal')">Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
  document.getElementById('pageTitle').textContent = 'Fornecedores';
  var fornecedores = [];

  function carregarFornecedores() {
    API.get('fornecedores').then(function(data) {
      fornecedores = Array.isArray(data) ? data : [];
      var tbody = document.getElementById('fornecedoresTable');
      if (fornecedores.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted" style="padding:40px;">Nenhum fornecedor cadastrado</td></tr>';
        return;
      }
      tbody.innerHTML = fornecedores.map(function(f) {
        return '<tr>' +
          '<td><strong>' + (f.nome || f.razao_social || '-') + '</strong></td>' +
          '<td>' + formatCNPJ(f.cnpj || f.documento || '-') + '</td>' +
          '<td>' + (f.contato || '-') + '</td>' +
          '<td>' + (f.email || '-') + '</td>' +
          '<td>' + (f.cidade || '-') + '/' + (f.uf || '') + '</td>' +
          '<td><span class="badge ' + ((f.status||'Ativo')==='Ativo'?'badge-success':'badge-danger') + '">' + (f.status||'Ativo') + '</span></td>' +
          '<td><button class="btn btn-sm btn-secondary" onclick="editarFornecedor(\'' + f.id + '\')"><i class="bi bi-pencil"></i></button> ' +
          '<button class="btn btn-sm btn-danger" onclick="excluirFornecedor(\'' + f.id + '\')"><i class="bi bi-trash"></i></button></td>' +
        '</tr>';
      }).join('');
    }).catch(function(err) {
      document.getElementById('fornecedoresTable').innerHTML = '<tr><td colspan="7" class="text-center text-muted" style="padding:40px;">Erro: ' + err.message + '</td></tr>';
    });
  }

  function abrirModalFornecedor(data) {
    document.getElementById('fornecedorForm').reset();
    document.getElementById('fId').value = '';
    document.getElementById('forModalTitle').textContent = 'Novo Fornecedor';
    if (data) {
      document.getElementById('forModalTitle').textContent = 'Editar Fornecedor';
      document.getElementById('fId').value = data.id;
      document.getElementById('fNome').value = data.nome || data.razao_social || '';
      document.getElementById('fFantasia').value = data.fantasia || '';
      document.getElementById('fDoc').value = data.cnpj || data.documento || '';
      document.getElementById('fIE').value = data.ie || '';
      document.getElementById('fContato').value = data.contato || '';
      document.getElementById('fTel').value = data.telefone || '';
      document.getElementById('fEmail').value = data.email || '';
      document.getElementById('fCep').value = data.cep || '';
      document.getElementById('fCidade').value = data.cidade || '';
      document.getElementById('fUF').value = data.uf || '';
      document.getElementById('fStatus').value = data.status || 'Ativo';
    }
    document.getElementById('fornecedorModal').classList.add('active');
  }

  function fecharModal(id) { document.getElementById(id).classList.remove('active'); }

  function salvarFornecedor(e) {
    e.preventDefault();
    var id = document.getElementById('fId').value;
    var data = {
      nome: document.getElementById('fNome').value,
      fantasia: document.getElementById('fFantasia').value,
      documento: document.getElementById('fDoc').value.replace(/\D/g, ''),
      ie: document.getElementById('fIE').value,
      contato: document.getElementById('fContato').value,
      telefone: document.getElementById('fTel').value,
      email: document.getElementById('fEmail').value,
      cep: document.getElementById('fCep').value,
      cidade: document.getElementById('fCidade').value,
      uf: document.getElementById('fUF').value,
      status: document.getElementById('fStatus').value
    };
    var promise = id ? API.put('fornecedores/' + id, data) : API.post('fornecedores', data);
    promise.then(function() {
      showAlert(id ? 'Fornecedor atualizado!' : 'Fornecedor criado!', 'success');
      fecharModal('fornecedorModal');
      carregarFornecedores();
    }).catch(function(err) { showAlert('Erro: ' + err.message, 'danger'); });
    return false;
  }

  function editarFornecedor(id) {
    var f = fornecedores.find(function(x) { return String(x.id) === String(id); });
    if (f) abrirModalFornecedor(f);
  }

  function excluirFornecedor(id) {
    if (!confirm('Excluir fornecedor?')) return;
    API.del('fornecedores/' + id).then(function() {
      showAlert('Fornecedor excluído!', 'success');
      carregarFornecedores();
    }).catch(function(err) { showAlert('Erro: ' + err.message, 'danger'); });
  }

  carregarFornecedores();
  </script>
  <script src="../components/footer.js"></script>
</body>
</html>
